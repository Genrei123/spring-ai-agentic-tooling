version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-poc-db
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass
    ports:
      - "5432:5432"
    volumes:
      - finance_pgdata:/var/lib/postgresql/data

volumes:
  finance_pgdata: